name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install "torch>=2.8,<3" --index-url https://download.pytorch.org/whl/cpu
      # pyproject.toml is frozen and allows any 3.x; README's tolerance note was recomputed on 3.12.0,
      # so CI pins the same version to keep the benchmark numbers comparable across runs.
      - run: pip install -e ".[rl,dev]" "mujoco==3.12.0"
      - run: python -c "import mujoco; assert mujoco.__version__ == '3.12.0', mujoco.__version__; print('mujoco', mujoco.__version__)"
      - run: pytest
      - run: ruff check src tests examples scripts
